<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伴手礼 List · Chelsea</title>
<link rel="stylesheet" href="../../assets/css/base.css">
<style>
  *{box-sizing:border-box;}
  body{margin:0;padding:34px 22px 64px;background:var(--bg);color:var(--ink);line-height:1.5;}
  .wrap{max-width:920px;margin:0 auto;}
  h1{font-family:var(--serif);font-size:30px;font-weight:400;margin:0 0 4px;letter-spacing:.5px;}
  .sub{font-family:var(--serif);color:var(--muted);font-size:14px;margin-bottom:26px;}
  .sub b{color:var(--ink);font-weight:400;}

  .card{position:relative;overflow:hidden;background:var(--paper);border:1px solid var(--line);
    border-radius:14px;padding:10px 12px;box-shadow:0 1px 3px rgba(0,0,0,.05);}
  .card .accent{position:absolute;left:0;top:0;bottom:0;width:4px;}
  #gifts{display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start;}
  .gift-group{padding-top:4px;}
  .gift-group h2{font-family:var(--serif);font-weight:400;font-size:17px;letter-spacing:.5px;
    margin:0;padding:10px 14px 10px;display:flex;align-items:baseline;}
  .gift-group h2 .gp{margin-left:auto;font-size:12px;color:var(--muted);}
  .gbar{height:4px;border-radius:2px;background:#33373f;margin:0 14px 6px;overflow:hidden;}
  .gbar i{display:block;height:100%;border-radius:2px;}

  .gift{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line);font-size:14px;}
  .gift:last-child{border-bottom:none;}
  .ck{flex:none;width:19px;height:19px;border-radius:50%;border:2px solid #4a505a;
    display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
  .ck.on{background:var(--sy);border-color:var(--sy);}
  .gift .who{flex:none;min-width:110px;font-family:var(--serif);font-weight:700;letter-spacing:.5px;}
  .gift .what{flex:1;}
  .gift .note{font-size:12px;color:var(--muted);margin-left:8px;}
  .gift .tbd{color:#6b7079;}

  #ideas{margin-top:20px;}
  .ideas .irows{columns:2 300px;column-gap:30px;padding:10px 14px 8px;}
  .idea{padding:5px 0;font-size:14px;break-inside:avoid;}
  .empty{font-family:var(--serif);color:var(--muted);border:1px dashed var(--line);border-radius:14px;
    padding:48px 24px;text-align:center;}

  @media(max-width:600px){
    body{padding:20px 12px 48px;}
    h1{font-size:24px;}
    .gift .who{min-width:88px;}
    #gifts{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <a class="home-link" href="../../2026-china-trip.html"><span class="arr">👈</span> Trip Plan</a>
    <h1>🎁&ensp;伴手礼 List</h1>
    <div class="sub"><b id="progress"></b></div>
  </header>

  <div id="gifts"></div>
  <div id="ideas"></div>

</div>
<script src="../../assets/js/gifts.js"></script>
<script src="../../assets/js/scroll-restore.js"></script>
</body>
</html>
